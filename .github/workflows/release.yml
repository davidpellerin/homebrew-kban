name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --manifest-path kban-rs/Cargo.toml --target ${{ matrix.target }}

      - name: Package binary
        run: |
          BINARY="kban-rs/target/${{ matrix.target }}/release/kban"
          ARCHIVE="kban-${{ matrix.target }}.tar.gz"
          mkdir -p dist
          cp "$BINARY" dist/kban
          cp -r web dist/web
          cp -r templates dist/templates
          tar -czf "$ARCHIVE" -C dist .
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.ARCHIVE }}
